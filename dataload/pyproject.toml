[project]
name = "dataload"
version = "0.1.0"
description = "Load CSV, Excel and Parquet files into Postgres as they are, then reshape with SQL, then grant read-only access"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]

[project.scripts]
dataload = "dataload.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4.9",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs Docker (Testcontainers Postgres 18)"]
