[project]
name = "glimmer-tune"
version = "0.1.0"
description = "Evaluation harness for A2UI Express generation (Muse Glimmer 30B and others)"
requires-python = ">=3.13"
dependencies = [
  # Pinned to one A2UI main commit: PyPI 0.9.0 lacks RendererState and
  # stateful parse_response, and a2ui-core >=0.4.1 is not on PyPI yet.
  # Moving the pin means re-checking the frozen dev/test references (canonical references
  # can change); their generator is in archive/.
  "a2ui-agent-sdk",
  "a2ui-core",
  "huggingface-hub>=2.4.0",
  "playwright>=1.64.1",
  "pyyaml>=6.0",
  "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "lark>=1.3.1",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
a2ui-agent-sdk = { git = "https://github.com/a2ui-project/a2ui", rev = "825beac2813a6d0ccef3b6fb4124ad6c3c8419f0", subdirectory = "python/a2ui_agent" }
a2ui-core = { git = "https://github.com/a2ui-project/a2ui", rev = "825beac2813a6d0ccef3b6fb4124ad6c3c8419f0", subdirectory = "python/a2ui_core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2ui_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: generates many rows or every gallery family; skipped by -m \"not slow\" while iterating",
    "xdist_group: keeps a file on one pytest-xdist worker (set in conftest.py)",
]
