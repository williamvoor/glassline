# Gallery family -> split (ADR 0004). Hand-picked so that each split has a mix of
# component types. Every component in dev/test also appears in some train family.
# Don't move a family once data/test/cases.jsonl exists.

train:
  - 00_formatted-text
  - 00_interactive-button
  - 00_row-layout
  - 00_simple-login-form
  - 00_simple-text
  - 01_flight-status
  - 04_weather-current
  - 05_product-card
  - 06_music-player          # only Slider
  - 07_task-card             # CheckBox, DateTimeInput
  - 08_user-profile
  - 09_login-form
  - 11_purchase-complete
  - 13_coffee-order
  - 15_account-balance
  - 17_event-detail
  - 18_track-list
  - 19_software-purchase     # ChoicePicker
  - 22_credit-card
  - 23_step-counter
  - 24_recipe-card           # only Tabs
  - 26_podcast-episode       # only AudioPlayer
  - 28_countdown-timer
  - 29_movie-card            # only Video; Modal
  - 34_child-list-template   # List
  - 35_markdown-text

dev:
  - 03_calendar-day
  - 10_notification-permission
  - 14_sports-player
  - 21_shipping-status
  - 27_stats-card
  - 32_advanced-form-validator
  - 33_financial-data-grid

test:
  - 00_complex-layout
  - 02_email-compose
  - 12_chat-message
  - 16_workout-summary
  - 20_restaurant-card
  - 25_contact-card
  - 30_live-invitation-builder
  - 36_modal

# Multi-turn: no template support yet.
excluded:
  - 00_incremental
  - 31_incremental-dashboard

# Synthetic skeletons (ADR 0009): each is train-only, dev-only or held out. No
# synthetic row goes to test.
skeletons:
  train:
    - checkout_summary
    - confirmation_dialog
    - dashboard_grid
    - detail_sheet
    - faq_sections
    - media_gallery
    - notification_list
    - player_panel
    - profile_editor
    - search_results
    - settings_form
    - signup_form
    - tabbed_detail
    - wizard_step
  dev:
    - account_overview
    - booking_tabs
    - catalog_cards
    - filter_panel
    - order_tracker
    - split_overview
  held_out:
    - quick_actions
    - review_and_confirm

# Test family -> the archetype a skeleton would leak. The matcher (synth/lint.py)
# rejects a synthetic surface that mirrors the design.
banned_archetypes:
  00_complex-layout:
    description: a heading, a row of two or more text fields side by side, and a caption
    matcher: complex_layout
  02_email-compose:
    description: three or more label/value header rows, a divider, a body of paragraphs and a row of buttons
    matcher: email_compose
  12_chat-message:
    description: a templated list whose item is an avatar beside a name row and a message text
    matcher: chat_message
  16_workout-summary:
    description: an icon and title row, a divider, a row of three value-over-label stats and a footer text
    matcher: workout_summary
  20_restaurant-card:
    description: a hero image over a details column with a name/price row and a star rating row
    matcher: restaurant_card
  25_contact-card:
    description: an avatar, name and title, a divider, three or more icon detail rows and a row of buttons
    matcher: contact_card
  30_live-invitation-builder:
    description: a two-pane row with a form column beside a column holding a preview card
    matcher: live_invitation_builder
  36_modal:
    description: a heading and a button that opens a modal holding only a little text
    matcher: modal
