slice/book-writing-project/02:
  from: 2
  express: |
    surface("gallery-book-tracker", sendDataModel=true)
    $/chapters = [{chapterTitle: "Epilogue: The Harvest", wordCount: 2410, status: "Revised", readyForReview: "Yes"}, {chapterTitle: "6. Sourdough and Memory", wordCount: 2240, status: "Final", readyForReview: "No"}, {chapterTitle: "5. Physical Therapy", wordCount: 3520, status: "Revised", readyForReview: "Yes"}, {chapterTitle: "4. The Unsent Letter", wordCount: 3100, status: "First Draft", readyForReview: "No"}, {chapterTitle: "5. The Council of Thorns", wordCount: 5120, status: "Needs Rewrite", readyForReview: "No"}]
    $/searchQuery = ""
    $/statusFilter = []
    root = Card(main_column)
    main_column = Column([search_field, filter_picker, apply_button, headers_row, chapter_list])
    search_field = TextField("Search chapters", $/searchQuery, "shortText")
    filter_picker = ChoicePicker("Status", "multipleSelection", [{label: "Not Started", value: "Not Started"}, {label: "First Draft", value: "First Draft"}, {label: "Revised", value: "Revised"}, {label: "Needs Rewrite", value: "Needs Rewrite"}, {label: "Final", value: "Final"}], $/statusFilter, "checkbox")
    apply_button_text = Text("Apply")
    apply_button = Button(apply_button_text, _, Event("filter_chapters", {search: $/searchQuery, status: $/statusFilter}))
    headers_row = Row([h_title, h_word, h_status, h_ready])
    h_title = Text("Chapter Title", "h5")
    h_word = Text("Word Count", "h5")
    h_status = Text("Status", "h5")
    h_ready = Text("Ready for Review", "h5")
    chapter_list = List(_template($/chapters, chapter_row))
    chapter_row = Row([c_title, c_word, c_status, c_ready])
    c_title = Text($chapterTitle, "body")
    c_word = Text(formatNumber($wordCount, 0, false), "body")
    c_status = Text($status, "body")
    c_ready = Text($readyForReview, "body")

