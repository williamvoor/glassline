[project]
name = "vicprop"
version = "0.1.0"
description = "Victorian suburb median house prices in Postgres: workbook load and the explorer-facing mart schema"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
vicprop = "vicprop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vicprop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
