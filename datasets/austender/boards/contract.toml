title = "Contract"
question = "What is this contract for, over what period, and which suppliers share its value?"
scope = "This contract notice in mart.contract and its supplier rows, not only the clicked answer's filters"
key = "notice_id"
key_type = "text"
key_columns = ["notice_id"]
layout = """
root = Column([metrics, trend, top])
metrics = Row([Metric("contract_totals", "current_value", "Current value", 0, "currency_compact"), Metric("contract_totals", "amendment_count", "Amendments", 0, "int"), Metric("contract_totals", "supplier_count", "Suppliers", 0, "int")])
trend = Timeline("contract_period", "Contract period", "notice_id", "period_start", "period_end", value="current_value", format="currency_compact")
top = DataTable("contract_suppliers", "Suppliers on this contract", "supplier_name,value_share,contract_value", "value_share:currency_compact,contract_value:currency_compact", bars="value_share")
"""

[[queries]]
name = "contract_totals"
sql = "SELECT notice_id AS notice_id, agency_key AS agency_key, agency_name AS agency_name, current_value AS current_value, original_value AS original_value, amendment_count AS amendment_count, supplier_count AS supplier_count, is_cancelled AS is_cancelled FROM mart.contract WHERE notice_id = :notice_id"

[[queries]]
name = "contract_period"
sql = "SELECT notice_id AS notice_id, agency_name AS agency_name, period_start AS period_start, period_end AS period_end, current_value AS current_value FROM mart.contract WHERE notice_id = :notice_id AND period_start IS NOT NULL AND period_end IS NOT NULL AND period_start >= DATE '1900-01-01' AND period_end <= DATE '2100-12-31' AND period_end >= period_start"

[[queries]]
name = "contract_suppliers"
sql = "SELECT supplier_key AS supplier_key, supplier_name AS supplier_name, value_share AS value_share, contract_value AS contract_value FROM mart.contract_supplier WHERE notice_id = :notice_id ORDER BY value_share DESC LIMIT 15"
