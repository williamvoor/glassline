[project]
name = "explorer-agent"
version = "0.1.0"
description = "A2UI data explorer agent for Postgres"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "a2ui-a2a",
    "a2ui-agent-sdk",
    "a2ui-core",
    "litellm==1.106.6",
    "httpx-sse==0.4.3",
    "mcp>=2.3.0",
    "pglast==8.7",
    "psycopg-pool==3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

# One A2UI pin shared with glimmer-tune (ADR 0006): move both together.
[tool.uv.sources]
a2ui-agent-sdk = { git = "https://github.com/a2ui-project/a2ui", rev = "825beac2813a6d0ccef3b6fb4124ad6c3c8419f0", subdirectory = "python/a2ui_agent" }
a2ui-a2a = { git = "https://github.com/a2ui-project/a2ui", rev = "825beac2813a6d0ccef3b6fb4124ad6c3c8419f0", subdirectory = "python/a2ui_a2a" }
a2ui-core = { git = "https://github.com/a2ui-project/a2ui", rev = "825beac2813a6d0ccef3b6fb4124ad6c3c8419f0", subdirectory = "python/a2ui_core" }
austender = { path = "../../austender", editable = true }

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
addopts = "-m 'not live_db'"
markers = [
    "db: needs the disposable Postgres 18 test database (Docker)",
    "live_db: reads the loaded dataset database from the repo root's .env (genUI/.env); run by hand with -m live_db",
]

[dependency-groups]
dev = [
    "austender",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "testcontainers[postgres]==4.15.0",
]
