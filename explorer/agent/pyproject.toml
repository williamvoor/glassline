[project]
name = "explorer-agent"
version = "0.1.0"
description = "A2UI data explorer agent for Postgres"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "a2ui-a2a==0.1.0",
    "a2ui-agent-sdk==0.9.0",
    "litellm==1.106.6",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
