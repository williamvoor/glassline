[[scenario]]
id = "open-tender-share-fy2425"
reviewed = true
categories = ["share", "procurement-method"]
turns = ["What share of 2024-25 contract value was awarded through open tender?"]
visual = ["metric", "table", "chart"]

[scenario.reference]
sql = """
SELECT 100 * sum(value_share) FILTER (WHERE procurement_method = 'open') / sum(value_share) AS open_pct
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["open_pct"]

[scenario.tolerance]
open_pct = { rel = 0.002, percent = true }

[[scenario.alternates]]  # the split by method as values (one row per method), no percentage in SQL
sql = """
SELECT procurement_method, sum(value_share) AS value
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
GROUP BY procurement_method
"""
expect = ["procurement_method", "value"]

[[scenario.alternates]]  # open versus everything else (selective is only $58M, so it gets folded in)
sql = """
SELECT procurement_method = 'open' AS is_open, sum(value_share) AS value
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
GROUP BY 1
"""
expect = ["value"]

[[scenario.alternates]]  # open value and the total, e.g. two Metrics
sql = """
SELECT sum(value_share) FILTER (WHERE procurement_method = 'open') AS open_value, sum(value_share) AS total_value
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["open_value", "total_value"]

[[scenario.wrong]]
label = "cancelled contracts included"
sql = """
SELECT 100 * sum(current_value) FILTER (WHERE procurement_method = 'open') / sum(current_value) AS open_pct
FROM mart.contract
WHERE financial_year = '2024-25'
"""
expect = ["open_pct"]

[[scenario.wrong]]
label = "share of contract count, not value"
sql = """
SELECT 100.0 * count(*) FILTER (WHERE procurement_method = 'open') / count(*) AS open_pct
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["open_pct"]

[[scenario]]
id = "follow-up-first-supplier"
reviewed = true
categories = ["multi-turn", "result-reuse"]
turns = [
  "Which 5 suppliers received the most contract value in 2024-25?",
  "How many contracts did the first one win?",
]
visual = ["metric", "table"]
answer_in = ["metric", "prose"]  # the count must be stated, not just present in a reused table
# "the first one", not the third: the third is the FMS payment account, which an agent may rightly
# leave out of a supplier ranking (reference-values.md decision 3).

[scenario.reference]
sql = """
SELECT supplier_name, contract_count FROM mart.supplier_fy
WHERE financial_year = '2024-25' ORDER BY total_value DESC LIMIT 1
"""
expect = ["contract_count"]

