# End-to-end scenarios for the AusTender dataset (explorer/specs/scenarios/SPEC.md).
# Evaluation data: never put these in the agent's prompt or in any training set (ADR 0018).
# Expected values come from the reference SQL, run read-only at check time.
# Reviewed 2026-11-02: refuter reviews on the user's behalf, then signed off by the user.

# --- from the effort check (docs/effort-check/reference-values.md) ------------------------------

[[scenario]]
id = "defence-cy2014"
reviewed = true
categories = ["calendar-year", "name-match", "cancelled"]
turns = ["How much contract value did the Department of Defence award in calendar year 2014, and across how many contracts?"]
visual = ["metric", "table"]
max_model_calls = 3

[scenario.reference]  # both "Department of Defence" keys
sql = """
SELECT sum(current_value) AS total_value, count(current_value) AS contracts
FROM mart.contract
WHERE agency_name = 'Department of Defence' AND NOT is_cancelled
  AND publish_date >= DATE '2014-01-01' AND publish_date < DATE '2015-01-01'
"""
expect = ["total_value", "contracts"]

[[scenario.alternates]]  # the main key only, also correct if the answer says so
sql = """
SELECT sum(current_value) AS total_value, count(current_value) AS contracts
FROM mart.contract
WHERE agency_key = '62950639680' AND NOT is_cancelled
  AND publish_date >= DATE '2014-01-01' AND publish_date < DATE '2015-01-01'
"""
expect = ["total_value", "contracts"]

[[scenario.wrong]]
label = "financial year 2013-14 instead of calendar 2014"
sql = "SELECT sum(current_value) AS total_value FROM mart.contract WHERE agency_name = 'Department of Defence' AND NOT is_cancelled AND financial_year = '2013-14'"
expect = ["total_value"]

[[scenario.wrong]]
label = "financial year 2014-15 instead of calendar 2014"
sql = "SELECT sum(current_value) AS total_value FROM mart.contract WHERE agency_name = 'Department of Defence' AND NOT is_cancelled AND financial_year = '2014-15'"
expect = ["total_value"]

[[scenario.wrong]]
label = "cancelled contracts included"
sql = "SELECT sum(current_value) AS total_value FROM mart.contract WHERE agency_name = 'Department of Defence' AND publish_date >= DATE '2014-01-01' AND publish_date < DATE '2015-01-01'"
expect = ["total_value"]

[[scenario]]
id = "top-growth-fy2324"
reviewed = true
categories = ["amendments", "ranked-list"]
# The effort check's wording. With the agent's system prompt, Meta's content filter blocks any
# "dollar" wording tried ("grew the most in dollars", "had the largest dollar increase in value");
# this one passed every time (probed 2026-11-02). Ranking by percent stays a labelled wrong answer.
turns = ["Which 10 contracts published in 2023-24 grew the most through amendments, from what to what?"]
visual = ["table"]

[scenario.reference]
sql = """
SELECT notice_id, original_value, current_value, value_change
FROM mart.contract
WHERE financial_year = '2023-24' AND NOT is_cancelled AND value_change IS NOT NULL
ORDER BY value_change DESC
LIMIT 10
"""
expect = ["notice_id", "original_value", "current_value"]

[[scenario.wrong]]
label = "ranked by percent growth instead of dollars"
sql = """
SELECT notice_id FROM mart.contract
WHERE financial_year = '2023-24' AND NOT is_cancelled AND value_change IS NOT NULL AND original_value > 0
ORDER BY value_change / original_value DESC
LIMIT 10
"""
expect = ["notice_id"]

[[scenario]]
id = "value-by-fy"
reviewed = true
categories = ["trend", "partial-period"]
turns = ["How has total contract value changed by financial year since the data starts?"]
visual = ["chart", "table"]

[scenario.reference]
sql = """
SELECT financial_year, sum(current_value) AS total
FROM mart.contract
WHERE NOT is_cancelled
GROUP BY financial_year
ORDER BY financial_year
"""
expect = ["financial_year", "total"]

[[scenario.alternates]]  # leaving out the two partial years (2012-13 from January, the latest from July) is defensible
sql = """
SELECT financial_year, sum(current_value) AS total
FROM mart.contract
WHERE NOT is_cancelled AND financial_year > '2012-13'
  AND financial_year < (SELECT max(financial_year) FROM mart.contract)
GROUP BY financial_year
"""
expect = ["financial_year", "total"]

[[scenario.wrong]]
label = "cancelled contracts included"
sql = "SELECT financial_year, sum(current_value) AS total FROM mart.contract GROUP BY financial_year"
expect = ["total"]

[[scenario]]
id = "overseas-share-fy2425"
reviewed = true
categories = ["share", "flag-meaning"]
turns = ["What share of 2024-25 contract value went to overseas suppliers?"]
visual = ["metric", "table", "chart"]

[scenario.reference]
sql = """
SELECT 100 * sum(value_share) FILTER (WHERE is_overseas) / sum(value_share) AS overseas_pct
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["overseas_pct"]

[scenario.tolerance]
overseas_pct = { rel = 0.002, percent = true }

[[scenario.alternates]]  # the split as two values (e.g. a chart), with no percentage computed in SQL
sql = """
SELECT sum(value_share) FILTER (WHERE is_overseas) AS overseas_value,
       sum(value_share) FILTER (WHERE NOT is_overseas) AS other_value
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["overseas_value", "other_value"]

[[scenario.alternates]]  # overseas value and the total, e.g. two Metrics (macros can't divide)
sql = """
SELECT sum(value_share) FILTER (WHERE is_overseas) AS overseas_value, sum(value_share) AS total_value
FROM mart.contract_supplier
WHERE financial_year = '2024-25'
"""
expect = ["overseas_value", "total_value"]

[[scenario.wrong]]
label = "cancelled contracts in the denominator"
sql = """
SELECT 100 * (SELECT sum(value_share) FROM mart.contract_supplier WHERE financial_year = '2024-25' AND is_overseas)
           / sum(current_value) AS overseas_pct
FROM mart.contract
WHERE financial_year = '2024-25'
"""
expect = ["overseas_pct"]

[[scenario.wrong]]
label = "supplier-level overseas flag (foreign on any notice ever)"
sql = """
SELECT 100 * sum(cs.value_share) FILTER (WHERE s.is_overseas) / sum(cs.value_share) AS overseas_pct
FROM mart.contract_supplier cs JOIN mart.supplier s USING (supplier_key)
WHERE cs.financial_year = '2024-25'
"""
expect = ["overseas_pct"]

