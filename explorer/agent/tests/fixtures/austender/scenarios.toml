# --- Board scenarios (specs/scenarios/SPEC.md amendment "scored Board scenarios and the model A/B",
# explorer/SPEC.md §21). Written 2026-11-04 and unreviewed until the user signs them off. Each
# starts from the Explorer Board. The wrong entries name what a Board's context invites: losing
# the filter. Procurement method is set to open or selective, never limited (Meta's filter).
# The (a) questions say "in this view" but never name the method: the model must read it from
# the Board's state. The (c) scenarios score the pair's lifetime value, as a total or by financial
# year (the by-year alternates were added after the Spark probe); other shapes fail.
# Reviewed 2026-11-04: refuter review, fixes applied, then signed off by the user.

