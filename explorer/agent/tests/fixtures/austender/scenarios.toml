[[scenario]]
id = "cancelled-fy2425"
reviewed = true
categories = ["cancelled"]
turns = ["How many contracts published in 2024-25 were later cancelled, and what were they worth?"]
visual = ["metric", "table"]

[scenario.reference]
sql = """
SELECT count(*) AS cancelled_contracts, sum(current_value) AS cancelled_value
