title = "Agency"
question = "What has this agency spent, in which years, and with which suppliers?"
scope = "Every non-cancelled, valued contract for this agency across all financial years, not only the clicked answer's filters"
key = "agency_key"
key_type = "text"
key_columns = ["agency_key"]
layout = """
root = Column([metrics, trend, top])
metrics = Row([Metric("agency_totals", "agency_name", "Agency", 0, "text"), Metric("agency_totals", "total_value", "Total spend", 0, "currency_compact"), Metric("agency_totals", "contract_count", "Contracts", 0, "int")])
trend = LineChart("agency_trend", "financial_year", "total_value", "Spend by financial year", format="currency_compact")
top = DataTable("agency_suppliers", "Top suppliers for this agency", "supplier_name,total_value,contract_count", "total_value:currency_compact,contract_count:int", bars="total_value")
"""

[[queries]]
name = "agency_totals"
sql = "SELECT agency_name AS agency_name, sum(total_value) AS total_value, sum(contract_count) AS contract_count, count(DISTINCT financial_year) AS year_count FROM mart.agency_fy WHERE agency_key = :agency_key GROUP BY agency_name"

[[queries]]
name = "agency_trend"
sql = "SELECT agency_key AS agency_key, financial_year AS financial_year, total_value AS total_value, contract_count AS contract_count FROM mart.agency_fy WHERE agency_key = :agency_key ORDER BY financial_year"

[[queries]]
name = "agency_suppliers"
sql = "SELECT supplier_key AS supplier_key, supplier_name AS supplier_name, sum(total_value) AS total_value, sum(contract_count) AS contract_count FROM mart.supplier_agency_fy WHERE agency_key = :agency_key AND supplier_key NOT LIKE 'withheld:%' GROUP BY supplier_key, supplier_name ORDER BY total_value DESC LIMIT 15"
