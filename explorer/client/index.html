<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer</title>
    <style>
      body { margin: 0; background: white; color: #202124; font-family: system-ui, sans-serif; }
      explorer-app { display: block; max-width: 960px; margin: 0 auto; padding: 16px; }
      explorer-app form { display: flex; gap: 8px; position: sticky; bottom: 0; background: white; padding: 8px 0; }
      explorer-app input { flex: 1; padding: 8px; font-size: 1rem; }
      explorer-app .turn { border-top: 1px solid #ddd; padding: 12px 0; }
      explorer-app .question { font-weight: 600; }
      explorer-app .status { color: #666; font-style: italic; }
      explorer-app .error { color: #b00020; }
      table.data-grid { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      table.data-grid th, table.data-grid td { padding: 4px 8px; border-bottom: 1px solid #eee; }
      table.data-grid caption { caption-side: bottom; color: #666; font-size: 0.85em; text-align: left; }
      details.sql-details { margin: 4px 0 12px; color: #444; }
      details.sql-details pre { background: #f6f8fa; padding: 8px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <explorer-app></explorer-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
