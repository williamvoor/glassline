<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The basic catalog's Icon renders Material Symbols ligatures; without the font they show as words. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      /* Theme (SPEC §16, ADR 0026): one set of tokens for the page, A2UI and the charts. Light
         values from the "Follow the Contract" prototype; dark values are ours. */
      :root {
        color-scheme: light dark;
        --ink: #17202e; --on-ink: #ffffff; --fg: #17202e; --muted: #4a5363; --faint: #7a8291;
        --line: #e2e5ea; --line-strong: #c2c8d2; --canvas: #f2f3f5; --panel: #ffffff; --soft: #eceef1;
        --primary: #17202e; --on-primary: #ffffff;
        --accent: #1f5fbf; --on-accent: #ffffff; --accent-soft: #eaf0f8; --accent-line: #b8c9e3;
        --error: #b00020; --error-bg: #fdecee; --warn-bg: #fff6e5;
        --chart-1: #2e4a7d; --chart-2: #d97757; --chart-3: #5b8bd0; --chart-4: #6e9b76; --chart-5: #9a6fb0; --chart-6: #c9a35b;
        --sans: 'Public Sans Variable', system-ui, sans-serif;
        --mono: 'JetBrains Mono Variable', ui-monospace, monospace;
        /* Models on show (Workspaces SPEC phase 3, ADR 0044): one accent per model, apart from the charts'. */
        --model-wonder: #6a4ce0; --model-wonder-soft: #efebfd; --model-spark: #0a6b60; --model-spark-soft: #e3f4f1;
        --glass: color-mix(in srgb, var(--panel) 74%, transparent); --glass-line: color-mix(in srgb, var(--line-strong) 60%, transparent);
        --glass-shadow: 0 1px 0 color-mix(in srgb, #ffffff 70%, transparent) inset, 0 12px 32px -18px color-mix(in srgb, var(--ink) 35%, transparent);

        /* A2UI basic catalog (its defaults are zero-specificity, so these win). */
        --a2ui-color-background: var(--canvas); --a2ui-color-on-background: var(--fg);
        --a2ui-color-surface: var(--panel); --a2ui-color-on-surface: var(--fg);
        --a2ui-color-primary: var(--primary); --a2ui-color-on-primary: var(--on-primary);
        --a2ui-color-secondary: var(--panel); --a2ui-color-on-secondary: var(--fg);
        --a2ui-color-border: var(--line); --a2ui-color-input: var(--panel); --a2ui-color-on-input: var(--fg);
        --a2ui-border-radius: 8px;
        --a2ui-font-family-title: var(--sans); --a2ui-font-family-monospace: var(--mono);
        --a2ui-card-background: var(--panel); --a2ui-card-border: 1px solid var(--line);
        --a2ui-card-border-radius: 8px; --a2ui-card-padding: 14px 16px;
        --a2ui-card-box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 4%, transparent), 0 1px 3px color-mix(in srgb, var(--ink) 6%, transparent); --a2ui-card-margin: 0;
        --a2ui-button-border: 1px solid var(--line-strong); --a2ui-button-border-radius: 999px;
        --a2ui-button-padding: 6px 14px; --a2ui-button-box-shadow: none; --a2ui-button-font-weight: 500;
        --a2ui-text-color-text: var(--fg); --a2ui-text-caption-color: var(--muted); --a2ui-text-a-color: var(--accent);
        --a2ui-divider-border: 1px solid var(--line);
        --a2ui-choicepicker-chip-border: 1px solid var(--line-strong);
        --a2ui-choicepicker-chip-background-selected: var(--primary); --a2ui-choicepicker-chip-padding: 4px 10px;
        --a2ui-row-gap: 16px; --a2ui-column-gap: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #0a0e15; --on-ink: #e8ebf0; --fg: #e6e9ee; --muted: #a6aebb; --faint: #7d8696;
          --line: #2a3341; --line-strong: #3d4858; --canvas: #10151d; --panel: #171e29; --soft: #1f2834;
          --primary: #e6e9ee; --on-primary: #10151d;
          --accent: #82abee; --on-accent: #0a0e15; --accent-soft: #1b2a41; --accent-line: #35507a;
          --error: #ff8a9a; --error-bg: #3a1a21; --warn-bg: #3a3019;
          --chart-1: #8aa8e0; --chart-2: #e8916f; --chart-3: #5d8fd6; --chart-4: #8fbf97; --chart-5: #bb98d0; --chart-6: #d9b872;
          --model-wonder: #a898ff; --model-wonder-soft: #262044; --model-spark: #4fcfbe; --model-spark-soft: #12302d;
          --glass-shadow: 0 1px 0 color-mix(in srgb, #ffffff 6%, transparent) inset, 0 16px 40px -20px #000000;
          --a2ui-card-box-shadow: none;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--canvas); color: var(--fg); font: 15px/1.5 var(--sans); }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.55; }
      code, pre, kbd { font-family: var(--mono); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .label {
        font: 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }

      /* Layout: top bar, Sidebar, Canvas ---------------------------------------------------- */
      explorer-app { display: flex; flex-direction: column; height: 100vh; }
      explorer-app .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: none;
        padding: 12px 24px; background: var(--ink); color: var(--on-ink); border-bottom: 1px solid var(--line);
      }
      explorer-app .topbar .title { display: flex; align-items: center; gap: 16px; min-width: 0; }
      explorer-app .topbar .brand { display: flex; align-items: center; gap: 10px; flex: none; }
      explorer-app .topbar .brand img { display: block; width: 28px; height: 28px; }
      explorer-app .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
      explorer-app .topbar .dataset {
        padding-left: 16px; border-left: 1px solid color-mix(in srgb, var(--on-ink) 25%, transparent);
        color: color-mix(in srgb, var(--on-ink) 85%, transparent); font-size: 14px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      explorer-app .topbar button {
        flex: none; padding: 7px 14px; border-radius: 8px; background: transparent; color: var(--on-ink);
        border: 1px solid color-mix(in srgb, var(--on-ink) 30%, transparent); font-weight: 500;
      }
      explorer-app .topbar :focus-visible { outline-color: var(--on-ink); } /* accent is too dark on ink */
      explorer-app .topbar button:hover:not(:disabled) { background: color-mix(in srgb, var(--on-ink) 10%, transparent); }
      /* Selected Workspace or Settings: inverted, since the top bar's own text colour wins over a pale fill. */
      explorer-app .topbar button[aria-pressed=true],
      explorer-app .topbar button[aria-pressed=true]:hover:not(:disabled) {
        background: var(--on-ink); color: var(--ink); border-color: var(--on-ink);
      }

      explorer-app .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
      explorer-app .sidebar {
        display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line);
      }
      /* The investigation log (SPEC §18): one entry per tab, in the order they opened */
      explorer-app .log-head {
        display: flex; justify-content: space-between; width: 100%; padding: 16px 20px 12px; text-align: left;
        border: 0; border-bottom: 1px solid var(--line); background: none; cursor: default;
      }
      explorer-app .log { flex: 1; overflow-y: auto; margin: 0; padding: 12px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
      explorer-app .log-spacer { flex: 1; } /* keeps the composer at the bottom before the first entry */
      explorer-app .log-entry {
        display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 10px 12px; text-align: left;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      }
      explorer-app .log-entry:hover { border-color: var(--line-strong); }
      explorer-app .log-entry.selected { background: var(--accent-soft); border-color: var(--accent-line); }
      explorer-app .log-tag { font: 500 10px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
      explorer-app .log-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; overflow-wrap: anywhere; }
      explorer-app .entry-state { display: flex; align-items: center; gap: 6px; min-height: 1em; font: 12px/1.3 var(--mono); color: var(--muted); }
      explorer-app .entry-state:empty { display: none; }

      explorer-app .composer {
        display: flex; flex-direction: column; gap: 8px; padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--panel);
      }
      explorer-app .composer textarea {
        resize: vertical; min-height: 72px; max-height: 40vh; padding: 10px 12px; font: inherit; font-size: 14px;
        color: var(--fg); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px;
      }
      explorer-app .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      explorer-app .composer button {
        align-self: flex-end; padding: 8px 20px; border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 600;
      }

      explorer-app .canvas { min-height: 0; overflow-y: auto; padding: 28px 32px 48px; }
      explorer-app .canvas > * { max-width: 1120px; margin-left: auto; margin-right: auto; }
      explorer-app .banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--line-strong); }
      explorer-app .banner button { margin-left: 8px; padding: 2px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
      /* Workspaces (specs/workspaces/SPEC.md phase 1) */
      explorer-app .workspaces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      explorer-app .workspace { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg); }
      explorer-app .workspace.unavailable { color: var(--faint); border-style: dashed; }
      explorer-app .workspace .reason { font-size: 0.85em; }
      explorer-app .retry-workspace, explorer-app .open-current, explorer-app .saved-list button { padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg); }
      explorer-app .saved-toggle { margin: 8px 16px 0; padding: 4px 0; border: 0; background: none; color: var(--accent); text-align: left; cursor: pointer; }
      explorer-app .saved-list { margin: 4px 16px 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: 40vh; overflow: auto; }
      explorer-app .saved-list ol { list-style: none; margin: 0 0 8px; padding: 0; }
      explorer-app .saved-list li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
      explorer-app .saved-list .open-saved { border: 0; padding: 0; color: var(--accent); text-align: left; flex: 1 1 100%; overflow-wrap: anywhere; }
      explorer-app .saved-date { color: var(--muted); font-size: 0.85em; }
      explorer-app .notice { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--line-strong); }
      /* Settings (Workspaces SPEC phase 2): the bootstrap views, from the retired explorer/bootstrap/ui */
      explorer-app [hidden] { display: none !important; } /* Settings stays mounted while hidden */
      explorer-app .settings-toggle { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg); }
      /* Glassline glass (Workspaces SPEC phase 3): frosted panels over a soft wash of the brand and model accents. */
      explorer-app .settings-page {
        flex: 1; min-height: 0; overflow: auto; padding: 28px 24px 0; /* no bottom padding: it would lift the sticky footer */
        background:
          radial-gradient(60rem 30rem at 8% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
          radial-gradient(44rem 26rem at 96% 4%, color-mix(in srgb, var(--model-wonder) 14%, transparent), transparent 70%),
          radial-gradient(40rem 24rem at 70% 110%, color-mix(in srgb, var(--model-spark) 12%, transparent), transparent 70%),
          var(--canvas);
      }
      explorer-settings { display: block; max-width: 1080px; margin: 0 auto; padding-bottom: 32px; --ok: #15803d; --warn: #b45309; --bad: var(--error); --muted-ink: var(--muted); }
      @media (prefers-color-scheme: dark) { explorer-settings { --ok: #6fd08f; --warn: #f0b25a; } }
      explorer-settings .glass {
        margin: 0 0 16px; padding: 22px 26px; border: 1px solid var(--glass-line); border-radius: 16px;
        background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
        box-shadow: var(--glass-shadow);
      }
      explorer-settings h1 { margin: 0 0 4px; font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; }
      explorer-settings h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.015em; }
      explorer-settings .lede { margin: 0 0 14px; max-width: 68ch; color: var(--muted); }
      explorer-settings .list-head, explorer-settings .wizard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      explorer-settings .list-head p, explorer-settings .wizard-head p { margin: 0; }
      explorer-settings .actions { white-space: nowrap; text-align: right; }

      /* The step rail: numbered, because the steps are a sequence; each says what does the work. */
      explorer-settings .wizard-steps ol {
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 0 0 20px; padding: 0; list-style: none; counter-reset: none;
      }
      explorer-settings .wizard-steps li { position: relative; min-width: 0; }
      explorer-settings .wizard-steps li::before { /* the rail between steps */
        content: ''; position: absolute; top: 17px; left: -50%; right: 50%; height: 2px; background: var(--line-strong);
      }
      explorer-settings .wizard-steps li:first-child::before { display: none; }
      explorer-settings .wizard-steps li.done::before, explorer-settings .wizard-steps li.current::before { background: var(--accent); }
      explorer-settings .step-link {
        position: relative; z-index: 1; /* above the next step's rail, which starts at this circle's centre */
        display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%;
        padding: 0 4px; border: 0; background: none; color: var(--muted); font: inherit; text-align: center;
      }
      explorer-settings button.step-link:hover .step-name { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
      explorer-settings .step-link .num {
        display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
        border: 2px solid var(--line-strong); background: var(--panel); font-weight: 700; font-variant-numeric: tabular-nums;
        transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
      }
      explorer-settings .done .num { border-color: var(--accent); color: var(--accent); }
      explorer-settings .current .num {
        border-color: var(--accent); background: var(--accent); color: var(--on-accent);
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      explorer-settings .step-name { font-size: 14px; font-weight: 500; }
      explorer-settings .current .step-name { color: var(--fg); font-weight: 700; }
      explorer-settings .locked .num { border-style: dashed; }
      explorer-settings .step-link .model-chip { font-size: 11px; }

      /* Model chips: the same everywhere a model works (step rail, run cards, answer Turns). */
      .model-chip {
        display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px;
        font: 600 12px/1.5 var(--sans); white-space: nowrap; vertical-align: middle;
        border: 1px solid var(--line-strong); background: var(--soft); color: var(--muted);
      }
      .model-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .model-chip.model-wonder { color: var(--model-wonder); background: var(--model-wonder-soft); border-color: color-mix(in srgb, var(--model-wonder) 35%, transparent); }
      .model-chip.model-spark { color: var(--model-spark); background: var(--model-spark-soft); border-color: color-mix(in srgb, var(--model-spark) 35%, transparent); }
      .model-chip.model-sql { padding: 2px 8px; font: 600 11px/1.5 var(--mono); letter-spacing: 0.02em; color: var(--muted); background: transparent; }
      .model-chip.live .dot { animation: chip-pulse 1.4s ease-in-out infinite; }
      @keyframes chip-pulse { 0%, 100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 5px transparent; opacity: .55; } }

      /* The run card: the one loud thing — calls as bars (cached part lighter), spend filling towards the ceiling. */
      explorer-settings .run-card {
        margin: 16px 0 4px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--glass-line);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
      }
      explorer-settings .run-card header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      explorer-settings .run-card .run-what { flex: 1; font-weight: 600; }
      explorer-settings .run-card .run-calls { color: var(--muted); font-variant-numeric: tabular-nums; }
      explorer-settings .run-card .run-calls strong { color: var(--fg); font-size: 20px; }
      explorer-settings .run-steps { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; overflow-x: hidden; }
      explorer-settings .run-steps li { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; animation: step-in .25s ease-out; }
      explorer-settings .run-steps li.sql { grid-template-columns: auto minmax(0, 1fr); color: var(--muted); }
      explorer-settings .run-steps li.rejected { display: block; color: var(--warn); }
      explorer-settings .run-steps .bar {
        display: flex; height: 10px; min-width: 6px; border-radius: 5px; overflow: hidden; animation: bar-grow .5s cubic-bezier(.2, .8, .2, 1);
        transform-origin: left center;
      }
      explorer-settings .run-card:has(.model-wonder) { --run: var(--model-wonder); }
      explorer-settings .run-card:has(.model-spark) { --run: var(--model-spark); }
      explorer-settings .run-steps .bar .cached { background: color-mix(in srgb, var(--run, var(--accent)) 35%, transparent); }
      explorer-settings .run-steps .bar .fresh { background: var(--run, var(--accent)); }
      explorer-settings .run-steps .bar .out { background: color-mix(in srgb, var(--run, var(--accent)) 60%, var(--fg)); }
      explorer-settings .run-steps .call-text { color: var(--muted); font-variant-numeric: tabular-nums; }
      explorer-settings .meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
      explorer-settings .meter-fill { display: block; height: 100%; border-radius: 3px; background: var(--run, var(--accent)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
      explorer-settings .meter-text { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
      explorer-settings .meter-text strong { color: var(--fg); }
      explorer-settings .run-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
      @keyframes bar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes step-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

      /* A step change answers the click: the new step slides in from the direction of travel. */
      explorer-settings .wizard-body > :not([hidden]) { animation: step-in .22s ease-out; }
      explorer-settings .wizard-footer {
        position: sticky; bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 16px; margin-top: 8px; padding: 12px 16px;
        border: 1px solid var(--glass-line); border-radius: 14px; background: var(--glass);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--glass-shadow);
      }
      explorer-settings .wizard-footer .spacer, explorer-settings .wizard-footer .blockers { flex: 1; }
      explorer-settings .wizard-footer .blockers { margin: 0; padding-left: 18px; color: var(--bad); font-size: 13px; }

      /* Inline confirmation cards (no pop-ups). */
      .confirm-card {
        margin: 12px 0; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-strong);
        border-left: 4px solid var(--warn, #b45309); background: var(--warn-bg); color: var(--fg); animation: step-in .18s ease-out;
      }
      .confirm-card.danger { border-left-color: var(--error); background: var(--error-bg); }
      .confirm-card p { margin: 0 0 10px; }
      .confirm-card .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .confirm-card button { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); font-weight: 600; }
      .confirm-card.danger .card-confirm { background: var(--error); border-color: var(--error); color: var(--on-accent); }
      .confirm-card.warn .card-confirm { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

      explorer-settings .done-card h2 { font-size: 26px; }
      explorer-settings .done-card .warn-text { color: var(--warn); }
      explorer-settings .name-field { display: flex; flex-direction: column; gap: 6px; max-width: 360px; font-weight: 600; }
      explorer-settings .name-field input { padding: 9px 12px; font: 15px var(--mono); border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); color: var(--fg); }
      explorer-settings .connections { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
      explorer-settings .connect-var { font-family: var(--mono); font-size: 13px; }
      explorer-settings .connect-var[aria-checked=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      explorer-settings .notice-wizard { padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); }
      explorer-settings select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; }
      explorer-settings label { display: inline-flex; align-items: center; gap: 6px; }
      explorer-settings label.schema { display: flex; }
      @media (max-width: 720px) {
        explorer-settings .wizard-steps .step-name, explorer-settings .wizard-steps .model-chip { display: none; }
        explorer-settings .glass { padding: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        explorer-settings *, explorer-settings *::before, .model-chip .dot, .confirm-card {
          animation: none !important; transition: none !important;
        }
      }
      explorer-app .meta .model-chip { margin-right: 8px; }
      explorer-app .meta-saved { margin-top: 16px; }
      explorer-settings table { border-collapse: collapse; width: 100%; margin: 12px 0; }
      explorer-settings caption { text-align: left; font-weight: 600; padding: 4px 0; }
      explorer-settings th, explorer-settings td { text-align: left; vertical-align: top; padding: 4px 8px; border-bottom: 1px solid var(--line); }
      explorer-settings .mono, explorer-settings code, explorer-settings textarea { font-family: var(--mono); font-size: 13px; }
      explorer-settings textarea { width: 100%; box-sizing: border-box; }
      explorer-settings textarea.invalid { outline: 2px solid var(--bad); }
      explorer-settings .muted { color: var(--muted); }
      explorer-settings .missing, explorer-settings .error, explorer-settings .errors, explorer-settings .refused, explorer-settings .warn { color: var(--bad); }
      explorer-settings .ok { color: var(--ok); }
      explorer-settings .badge { display: inline-block; border-radius: 10px; padding: 0 8px; font-size: 12px; border: 1px solid currentColor; }
      explorer-settings .badge.ok, explorer-settings .state-verified { color: var(--ok); }
      explorer-settings .badge.warn, explorer-settings .state-needs-review, explorer-settings .state-edited { color: var(--warn); }
      explorer-settings .state-failed, explorer-settings .state-error, explorer-settings .state-not-checked { color: var(--bad); }
      explorer-settings .summary { display: flex; flex-wrap: wrap; gap: 32px; } explorer-settings .summary dt { color: var(--muted); } explorer-settings .summary dd { margin: 0; font-size: 1.2rem; }
      explorer-settings .summary .over { color: var(--bad); }
      explorer-settings .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      explorer-settings button { padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); color: var(--fg); font-weight: 500; }
      explorer-settings button:hover:not(:disabled) { border-color: var(--fg); }
      explorer-settings button.primary { padding: 9px 20px; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); font-weight: 650; }
      explorer-settings button.primary:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
      explorer-settings button:disabled { opacity: .5; }
      /* Review's and Boards' file tabs: one row (their `tab` class also picks up the Explorer's tab look). */
      explorer-settings [role=tablist] { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0 0; }
      explorer-settings [role=tab][aria-selected=true] { font-weight: 700; border-bottom: 2px solid var(--accent); }
      explorer-settings .claim { margin: 12px 0; } explorer-settings .claim.dismissed { opacity: .6; }
      explorer-settings label.schema { display: block; }

      explorer-app .empty { padding: 48px 0 24px; color: var(--muted); }
      explorer-app .empty h2 { margin: 0 0 6px; color: var(--fg); font-size: 28px; letter-spacing: -0.02em; }
      explorer-app .empty .label { margin-top: 28px; }
      explorer-app .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      explorer-app .examples button {
        padding: 8px 16px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--panel); color: var(--fg); text-align: left;
      }
      explorer-app .examples button:hover { border-color: var(--fg); }
      explorer-app .no-workspaces .open-settings { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 600; }

      /* Tabs (SPEC §18): one strip for the investigation; the selected tab below it ------------- */
      explorer-app .tab-strip {
        display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin;
      }
      explorer-app .tab {
        display: flex; align-items: center; flex: none; max-width: 260px; margin-bottom: -1px;
        border: 1px solid transparent; border-bottom-color: var(--line); border-radius: 8px 8px 0 0;
      }
      explorer-app .tab.selected { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); }
      explorer-app .tab-select {
        display: flex; align-items: center; gap: 6px; min-width: 0; padding: 8px 6px 8px 12px; border: 0; background: none;
        color: var(--muted); font-size: 13px;
      }
      explorer-app .tab.selected .tab-select { color: var(--fg); font-weight: 600; }
      explorer-app .tab:not(:has(.tab-close)) .tab-select { padding-right: 12px; }
      explorer-app .tab-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      explorer-app .new-tag {
        flex: none; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
        font: 600 9px/1.6 var(--mono); letter-spacing: 0.06em;
      }
      explorer-app .tab-close {
        flex: none; width: 22px; height: 22px; margin-right: 6px; padding: 0; border: 0; border-radius: 4px;
        background: none; color: var(--faint); font-size: 15px; line-height: 1;
      }
      explorer-app .tab-close:hover:not(:disabled) { background: var(--soft); color: var(--fg); }
      explorer-app .tab-view { scroll-margin-top: 16px; }
      explorer-app .question, explorer-app .prose { overflow-wrap: anywhere; }
      explorer-app .question { margin: 0 0 12px; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; white-space: pre-wrap; }
      explorer-app .status { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); font: 13px/1.4 var(--mono); }
      explorer-app .spinner {
        flex: none; width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { explorer-app .spinner { animation-duration: 2.4s; } }
      explorer-app .elapsed { font-variant-numeric: tabular-nums; }
      explorer-app .error {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0; padding: 10px 14px;
        border-radius: 8px; background: var(--error-bg); color: var(--error);
      }
      explorer-app .error span { flex: 1; min-width: 12em; }
      explorer-app .error button { padding: 4px 12px; border: 1px solid var(--error); border-radius: 999px; background: var(--panel); color: var(--error); }
      explorer-app .prose { max-width: 72ch; margin-bottom: 16px; }
      explorer-app .prose p { margin: 0 0 8px; }
      explorer-app .meta { margin-top: 16px; color: var(--muted); font: 12px/1.5 var(--mono); }
      explorer-app .meta summary { cursor: pointer; }
      explorer-app .steps { margin: 6px 0 0; padding-left: 20px; }

      /* Actions (SPEC §15) */
      explorer-app .confirm {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 16px; padding: 10px 14px;
        border: 1px solid var(--accent-line); border-radius: 8px; background: var(--accent-soft);
      }
      explorer-app .confirm span { flex: 1; min-width: 12em; }
      explorer-app .confirm button { padding: 5px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--panel); }
      explorer-app .confirm button.ok { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
      explorer-app .level-view.inert { opacity: 0.5; pointer-events: none; transition: opacity 0.15s; }
      /* A Board's re-query (SPEC §18 slice 2): its layout (the surface root's last child) dims and
         takes no clicks; the heading and the Controls stay usable. */
      explorer-app .level-view.requery a2ui-surface > * > :last-child { opacity: 0.5; pointer-events: none; transition: opacity 0.15s; }

      /* Surfaces: Cards, titles, Metrics, buttons ------------------------------------------------ */
      explorer-app .level-view a2ui-surface { display: block; }
      explorer-app .a2ui-card { height: 100%; transition: box-shadow 150ms ease, border-color 150ms ease; }
      /* SPEC §22 step 3: hover deepens the shadow without moving the Card (a lift makes bars harder to click). */
      explorer-app .a2ui-card:hover { box-shadow: 0 2px 8px color-mix(in srgb, var(--ink) 8%, transparent); }
      @media (prefers-color-scheme: dark) { explorer-app .a2ui-card:hover { box-shadow: none; border-color: var(--line-strong); } }
      @media (prefers-reduced-motion: reduce) { explorer-app .a2ui-card { transition: none; } }
      explorer-app .a2ui-text h4 { margin: 0; font-size: 16px; font-weight: 600; }
      /* A Visual's title: the h4 that is a Card's first Text. Model-written h4s in prose keep the rule above. */
      explorer-app .a2ui-card > * > :first-child > .a2ui-text-h4 h4 { font: 600 11.5px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      explorer-app .a2ui-text.a2ui-text-caption { font: normal 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
      explorer-app .a2ui-text.a2ui-text-caption em { font-style: normal; } /* A2UI wraps captions in <em> */
      explorer-app .a2ui-text h2 { margin: 2px 0; font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      explorer-app a2ui-basic-button button:hover:not(:disabled) { border-color: var(--fg); }
      /* Phones (SPEC §22 P14): Rows of Cards stack, so every Card is full width and weights apply on wide
         screens only. A2UI sets each child's weight as an inline flex, hence !important. */
      @media (width < 640px) {
        explorer-app a2ui-basic-row:has(> a2ui-card) { flex-direction: column; }
        explorer-app a2ui-basic-row:has(> a2ui-card) > * { flex: 0 0 auto !important; width: 100%; }
      }
      /* Controls as chips (SPEC §22 step 6). */
      explorer-app .a2ui-chip { font: 12px/1.4 var(--mono); color: var(--fg); }
      explorer-app .a2ui-chip.a2ui-chip-selected { color: var(--on-primary); }

      /* Chart tooltips (SPEC §22): vega-tooltip's element lives in body; the class beats its defaults */
      #vg-tooltip-element.explorer-theme {
        padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg);
        box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); font: 12px/1.45 var(--sans);
      }
      #vg-tooltip-element.explorer-theme td.key { padding-right: 10px; color: var(--muted); }
      #vg-tooltip-element.explorer-theme td.value { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      /* Visual hints and DataGrid (SPEC §16) */
      .visual-hint { margin: 0 0 6px; font: 12px/1.4 var(--mono); color: var(--muted); }
      table.data-grid { border-collapse: collapse; width: 100%; font-size: 14px; }
      table.data-grid th {
        padding: 8px 10px; border-bottom: 1px solid var(--line-strong); color: var(--muted);
        font: 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
      }
      table.data-grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
      table.data-grid td[style*='right'] { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
      table.data-grid caption { caption-side: bottom; padding-top: 6px; color: var(--muted); font: 12px/1.4 var(--mono); text-align: left; }
      table.data-grid tr.clickable { cursor: pointer; }
      table.data-grid .share-bar { display: block; height: 4px; margin-top: 4px; background: var(--soft); border-radius: 2px; }
      /* SPEC §22 step 5: the fill grows from 0 when the row first renders (Lit keeps the span after that). */
      table.data-grid .share-bar > span { display: block; height: 100%; background: var(--chart-1); border-radius: 2px; animation: share-grow 300ms ease-out; }
      @keyframes share-grow { from { width: 0; } }
      @media (prefers-reduced-motion: reduce) { table.data-grid .share-bar > span { animation: none; } }
      table.data-grid tr.clickable:hover, table.data-grid tr.clickable:focus { background: var(--accent-soft); outline: none; }
      table.data-grid tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      table.data-grid .ask-tag {
        visibility: hidden; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--accent-line); border-radius: 4px;
        color: var(--accent); font: 500 10px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 1px;
      }
      table.data-grid tr.askable:hover .ask-tag, table.data-grid tr.askable:focus .ask-tag { visibility: visible; }
      details.sql-details { margin: 8px 0 0; color: var(--muted); font: 12px/1.4 var(--mono); }
      details.sql-details summary { cursor: pointer; color: var(--faint); }
      details.sql-details pre {
        margin: 8px 0 0; padding: 10px 12px; overflow-x: auto; border-radius: 6px; background: var(--soft); color: var(--fg); font-size: 12px;
      }

      /* Narrow screens: one column; the log a collapsible panel above the Canvas; the composer pinned at the bottom */
      @media (max-width: 759px) {
        explorer-app { height: auto; min-height: 100vh; }
        explorer-app .topbar { padding: 10px 16px; }
        explorer-app .topbar .dataset { display: none; }
        explorer-app .shell { display: flex; flex-direction: column; }
        explorer-app .sidebar { display: contents; }
        explorer-app .log-head { order: 1; padding: 10px 16px; background: var(--panel); cursor: pointer; }
        explorer-app .log-head::after { content: '▾'; margin-left: 8px; }
        explorer-app .log-head[aria-expanded='true']::after { content: '▴'; }
        explorer-app .log-head .count { margin-left: auto; }
        explorer-app .log { order: 1; flex: none; display: none; max-height: 50vh; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
        explorer-app .log.open { display: flex; }
        explorer-app .log-spacer { display: none; }
        explorer-app .log-text { -webkit-line-clamp: 2; }
        explorer-app .tab-strip { margin: -4px -16px 16px; padding: 0 16px; }
        explorer-app .canvas { order: 2; flex: 1; overflow: visible; padding: 20px 16px 24px; }
        explorer-app .question { font-size: 22px; }
        explorer-app .composer { order: 3; position: sticky; bottom: 0; z-index: 2; padding: 10px 16px; flex-direction: row; align-items: flex-end; }
        explorer-app .composer .label { display: none; }
        explorer-app .composer textarea { flex: 1; min-height: 44px; }
      }
    </style>
  </head>
  <body>
    <explorer-app></explorer-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
