<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dataset bootstrap</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light dark; --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --muted: #6b7280; }
      body { font: 15px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 1200px; padding: 1rem 1.5rem 4rem; }
      h1 { font-size: 1.3rem; margin: 0; }
      header { display: flex; gap: 2rem; align-items: center; border-bottom: 1px solid #8884; padding-bottom: .5rem; }
      .steps { display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0; }
      .steps li { padding: .2rem .6rem; border-radius: 1rem; color: var(--muted); }
      .steps li.current { background: var(--accent); color: white; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      caption { text-align: left; font-weight: 600; padding: .3rem 0; }
      caption div { font-weight: normal; }
      th, td { text-align: left; vertical-align: top; padding: .25rem .5rem; border-bottom: 1px solid #8883; }
      .mono, code, textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      textarea { width: 100%; box-sizing: border-box; }
      textarea.invalid { outline: 2px solid var(--bad); }
      .muted { color: var(--muted); }
      .missing, .error, .errors, .refused, .warn { color: var(--bad); }
      .ok { color: var(--ok); }
      .badge { display: inline-block; border-radius: .6rem; padding: 0 .5rem; font-size: 12px; border: 1px solid currentColor; }
      .badge.ok, .state-verified { color: var(--ok); }
      .badge.warn, .state-needs-review, .state-edited { color: var(--warn); }
      .state-failed, .state-error, .state-not-checked { color: var(--bad); }
      .summary { display: flex; gap: 2rem; } .summary dt { color: var(--muted); } .summary dd { margin: 0; font-size: 1.2rem; }
      .summary .over { color: var(--bad); }
      .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
      button { padding: .35rem .8rem; } button.primary { background: var(--accent); color: white; border: 0; border-radius: .3rem; }
      button:disabled { opacity: .5; }
      [role=tab][aria-selected=true] { font-weight: 700; border-bottom: 2px solid var(--accent); }
      .claim { margin: .8rem 0; } .claim.dismissed { opacity: .6; }
      label.schema { display: block; }
    </style>
  </head>
  <body>
    <bootstrap-app></bootstrap-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
