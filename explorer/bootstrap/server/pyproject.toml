[project]
name = "explorer-bootstrap"
version = "0.1.0"
description = "Dev tool for adding a Postgres dataset to the explorer: report, draft, export"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "explorer-agent",
    "httpx==0.28.1",
    "python-dotenv>=1.2.4",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
explorer-agent = { path = "../../agent", editable = true }
austender = { path = "../../../austender", editable = true }

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: needs the disposable Postgres 18 test database (Docker)",
]

[dependency-groups]
dev = [
    "austender",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "testcontainers[postgres]==4.15.0",
]
