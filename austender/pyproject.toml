[project]
name = "austender"
version = "0.1.0"
description = "AusTender OCDS contract notices in Postgres: ingestion, normalisation and the explorer-facing mart schema"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2025.1",
]

[project.scripts]
austender = "austender.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
