# One VM, the same as `explorer/run.sh --real` (Workspace mode). See README.md.
# Settings come from deploy/.env (copy .env.example).
#
# The agent, the bootstrap server (Settings) and Caddy share one network namespace, owned by `net`,
# so all three talk over 127.0.0.1, which both Python servers bind to and check in their Host
# guards. `net` holds the published ports and is never restarted, so any of the three can restart
# alone. Postgres is on the compose network only (as `db`) and is never published.
name: glassline

# Cap each container's logs (json-file default has no limit).
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  net:
    logging: *logging
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # TCP only: the security group doesn't open UDP, so no HTTP/3

  db:
    logging: *logging
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: austender_loader
      POSTGRES_PASSWORD: ${LOADER_PASSWORD:?set LOADER_PASSWORD in deploy/.env}
      POSTGRES_DB: austender
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dumps:/dumps:ro
    # Sized for a 2 GB VM shared with the agent, the bootstrap server and Caddy.
    command: ["postgres", "-c", "shared_buffers=384MB", "-c", "effective_cache_size=1GB",
              "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U austender_loader -d austender"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off (README, "Restore the database"): `docker compose run --rm roles`. Not started by `up`.
  roles:
    logging: *logging
    profiles: [setup]
    image: glassline-agent
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/austender/src
      LOADER_DSN: postgresql://austender_loader:${LOADER_PASSWORD}@db:5432/austender
      EXPLORER_RO_PASSWORD: ${EXPLORER_RO_PASSWORD:?set EXPLORER_RO_PASSWORD in deploy/.env}
    command: ["python", "/app/deploy/ensure_roles.py"]

  # Workspace mode: the Workspaces in /data (EXPLORER_DATA_DIR, seeded from deploy/workspaces.toml),
  # each with its own read-only login variable. Never LOADER_PASSWORD.
  agent:
    logging: *logging
    image: glassline-agent
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent
    restart: unless-stopped
    network_mode: service:net
    depends_on:
      net:
        condition: service_started
      db:
        condition: service_healthy
    # More read-only logins for Settings to offer (README, "Add a database"): <NAME>_DATABASE_URL=…
    env_file: &connections
      - path: connections.env
        required: false
    environment: &app-env
      EXPLORER_ENV_FILE: /nonexistent/.env
      BOOTSTRAP_ENV_FILE: /nonexistent/.env
      EXPLORER_DATA_DIR: /data
      MODEL: meta/muse-spark-1.3
      META_API_KEY: ${META_API_KEY:?set META_API_KEY in deploy/.env}
      AUSTENDER_DATABASE_URL: postgresql://explorer_ro:${EXPLORER_RO_PASSWORD:?set EXPLORER_RO_PASSWORD in deploy/.env}@db:5432/austender
      AGENT_HOST: 127.0.0.1
      AGENT_PORT: "10002"
      AGENT_PUBLIC_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}/agent/
      CLIENT_ORIGIN: https://${PUBLIC_HOST}
      LOG_LEVEL: INFO
      # Model runs per UTC day across all users and Workspaces (questions and Asks); a restart of
      # the agent resets the count. Bootstrap drafts are not counted.
      MAX_TURNS_PER_DAY: ${MAX_TURNS_PER_DAY:-200}
      TURN_LIMIT_CONTACT: ${TURN_LIMIT_CONTACT:-}
    volumes:
      - explorer_data:/data

  # Settings (New Workspace, Regenerate, Delete): explorer/bootstrap/server in Settings mode, as
  # run.sh starts it. Drafts with Muse Wonder (BOOTSTRAP_MODEL); reloads the agent over 127.0.0.1.
  bootstrap:
    logging: *logging
    image: glassline-agent
    restart: unless-stopped
    network_mode: service:net
    depends_on:
      net:
        condition: service_started
      agent:
        condition: service_started
    env_file: *connections
    environment: *app-env
    working_dir: /app/explorer/bootstrap/server
    command: ["/app/explorer/bootstrap/server/.venv/bin/python", "-m", "explorer_bootstrap", "serve", "--port", "8765"]
    volumes:
      - explorer_data:/data

  web:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_AGENT_URL: https://${PUBLIC_HOST}/agent
        VITE_BOOTSTRAP_URL: https://${PUBLIC_HOST}/bootstrap
    restart: unless-stopped
    network_mode: service:net
    depends_on:
      - net
      - agent
      - bootstrap
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./basic_auth.caddy:/etc/caddy/basic_auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  explorer_data:
  caddy_data:
  caddy_config:
